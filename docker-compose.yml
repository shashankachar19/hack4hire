version: '3.8'

services:
  dispatchgrid:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dispatchgrid-app
    restart: unless-stopped
    ports:
      - "3001:3001"
      - "5173:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=file:/app/server/prisma/dispatchgrid.db
    volumes:
      - dispatchgrid_data:/app/server/prisma
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3001/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  dispatchgrid_data:
    driver: local

